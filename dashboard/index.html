<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Localmind · Zihin Sarayı Paneli</title>
  <link rel="stylesheet" href="style.css?v=2.0.1" />
  <script src="d3.v7.min.js"></script>
</head>
<body>
  <!-- Ambient arka plan -->
  <canvas id="particles"></canvas>

  <div class="app">
    <!-- ───────────── HEADER ───────────── -->
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuToggle" title="Menü">☰</button>

      <div class="brand" onclick="navigate('overview')">
        <span class="brand-icon">🧠</span>
        <div class="brand-text">
          <b>Localmind</b>
          <small>Zihin Sarayı</small>
        </div>
      </div>

      <div class="global-search">
        <span class="gs-icon">⌕</span>
        <input id="globalSearch" type="text" autocomplete="off"
               placeholder="Hafızada ara… (Enter ile semantik arama)" />
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <div class="topbar-right">
        <div class="pill" id="pillPulse" title="Canlı nabız (SSE)">
          <span class="dot" id="pulseDot"></span><span id="pulseText">bağlanıyor…</span>
        </div>
        <div class="pill" id="pillOllama" title="Ollama durumu">
          <span class="dot" id="ollamaDot"></span><span id="ollamaText">Ollama</span>
        </div>
        <div class="pill total-pill" title="Toplam anı">
          <b id="headerTotal">0</b> <span>anı</span>
        </div>
        <button class="btn ghost" id="addBtn" title="Yeni anı ekle">+ Yeni Anı</button>
        <button class="icon-btn" id="themeToggle" title="Tema değiştir">◐</button>
      </div>
    </header>

    <div class="body">
      <!-- ───────────── SIDEBAR ───────────── -->
      <aside class="sidebar" id="sidebar">
        <nav class="nav-group">
          <h4>PANEL</h4>
          <a class="nav-link" data-view="overview" href="#overview"><span>🏠</span>Genel Bakış</a>
          <a class="nav-link" data-view="graph" href="#graph"><span>🕸️</span>Bilgi Grafiği</a>
          <a class="nav-link" data-view="rooms" href="#rooms"><span>🗂️</span>Odalar</a>
          <a class="nav-link" data-view="timeline" href="#timeline"><span>🕰️</span>Zaman Çizelgesi</a>
          <a class="nav-link" data-view="analytics" href="#analytics"><span>📊</span>Analitik</a>
          <a class="nav-link" data-view="reminders" href="#reminders"><span>🔔</span>Hatırlatmalar</a>
          <a class="nav-link" data-view="archive" href="#archive"><span>📦</span>Arşiv</a>
          <a class="nav-link" data-view="settings" href="#settings"><span>⚙️</span>Ayarlar</a>
        </nav>

        <nav class="nav-group">
          <h4>ODALAR</h4>
          <div id="roomNav" class="room-nav"><div class="muted small">yükleniyor…</div></div>
        </nav>

        <div class="sidebar-health" id="sidebarHealth">
          <div class="sh-row"><span>Toplam anı</span><b id="shTotal">–</b></div>
          <div class="sh-row"><span>Oda</span><b id="shRooms">–</b></div>
          <div class="sh-row"><span>Ollama</span><b id="shOllama">–</b></div>
          <div class="sh-row"><span>Sürüm</span><b id="shVersion">–</b></div>
          <div class="sh-row"><span>Nabız</span><b id="shPulse">–</b></div>
        </div>
      </aside>

      <!-- ───────────── MAIN ───────────── -->
      <main class="content" id="content">
        <div class="loading-full"><div class="spinner"></div></div>
      </main>
    </div>
  </div>

  <!-- Detay paneli / modal -->
  <div class="overlay hidden" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Hover tooltip -->
  <div class="tooltip hidden" id="tooltip"></div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="main.js?v=2.0.1"></script>
</body>
</html>
